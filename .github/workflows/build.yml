name: Build CLI Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.25.5'
  BUN_VERSION: 'latest'
  APP_NAME: silly

jobs:

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: bun install && bun run build

      - name: Build CLI (Windows x86_64)
        run: |
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -ldflags="-s -w" -o dist/${{ env.APP_NAME }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/${{ env.APP_NAME }}.exe


  build-linux:
    name: Linux (x86_64 + aarch64 musl)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install musl tools
        run: |
          sudo apt update
          sudo apt install -y musl-tools gcc-aarch64-linux-gnu

      - name: Build frontend
        working-directory: frontend
        run: bun install && bun run build

      - name: Build Linux x86_64
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" \
          -o dist/${{ env.APP_NAME }}-linux-x86_64

      - name: Build Linux aarch64 (musl static)
        run: |
          GOOS=linux GOARCH=arm64 \
          CGO_ENABLED=1 \
          CC=aarch64-linux-gnu-gcc \
          go build -ldflags="-s -w -extldflags '-static'" \
          -o dist/${{ env.APP_NAME }}-linux-aarch64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: dist/*


  create-release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/windows-x86_64/*.exe
            artifacts/linux-builds/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
